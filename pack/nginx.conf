# Orange TV nginx 示例配置
# 用户端监听 80 端口（根路径 /），管理端监听 81 端口（根路径 /）。
# 两端均将 /api 反向代理到后端 orange-tv 服务（默认 127.0.0.1:8080）。
#
# 部署说明：
#   1. 前端静态资源位于 /usr/share/nginx/html/client 与 /usr/share/nginx/html/admin。
#   2. 后端二进制由 docker-entrypoint.sh 以后台进程方式启动，nginx 在前台运行。
#   3. 如需 HTTPS，请自行添加 ssl 配置并替换 listen 端口。

# ── 后端上游 ───────────────────────────────────────────────────────────────
upstream orange_tv_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── 用户端 ─────────────────────────────────────────────────────────────────
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html/client;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API 反向代理到后端
    location /api/ {
        proxy_pass         http://orange_tv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # swagger 文档（可选）
    location /swagger/ {
        proxy_pass         http://orange_tv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 健康检查等系统路径
    location ~ ^/(health|readiness|liveness|version)$ {
        proxy_pass http://orange_tv_backend;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback：所有未匹配的路径返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── 管理端 ─────────────────────────────────────────────────────────────────
server {
    listen       81;
    server_name  _;

    root   /usr/share/nginx/html/admin;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass         http://orange_tv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /swagger/ {
        proxy_pass         http://orange_tv_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location ~ ^/(health|readiness|liveness|version)$ {
        proxy_pass http://orange_tv_backend;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
