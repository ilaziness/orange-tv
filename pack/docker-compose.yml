# Orange TV 一键 Docker Compose 部署
# 包含：orange-tv 应用（后端 + 前端 + nginx 一体化镜像）+ MySQL 数据库
#
# 使用方式：
#   1. 复制 .env.example 为 .env 并按需修改变量（或直接使用默认值）
#   2. docker compose up -d
#
# app 容器启动时会自动执行数据库迁移（AUTO_MIGRATE=true），
# 无需手动运行 migrate 命令。如需关闭自动迁移，设 AUTO_MIGRATE=false。
#
# 环境变量说明（可通过 .env 文件配置）：
#   DB_USER / DB_PASSWORD / DB_NAME — 数据库账号（同步注入 MySQL 和 app）
#   MYSQL_ROOT_PASSWORD             — MySQL root 密码
#   JWT_SECRET                      — JWT 签名密钥（生产环境必填，至少 32 字节）
#   HTTP_PORT / ADMIN_PORT / MYSQL_PORT — 端口映射
#   AUTO_MIGRATE                    — 是否在启动前自动迁移（true/false，默认 true）
#
# 访问地址（默认端口，可通过 .env 修改）：
#   用户端：http://<host>:80
#   管理端：http://<host>:81

services:
  # Orange TV 应用（后端 + 前端 + nginx 一体化镜像）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orange-tv
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"   # 用户端
      - "${ADMIN_PORT:-81}:81"  # 管理端
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=/app/configs/config.prod.yaml
      # 数据库连接（覆盖 config.prod.yaml 中的默认值）
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=${DB_USER:-orange}
      - DATABASE_PASSWORD=${DB_PASSWORD:-orange_password}
      - DATABASE_NAME=${DB_NAME:-orange_tv}
      # JWT 密钥（生产环境必填，至少 32 字节，请务必修改为随机字符串）
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-secret-at-least-32-bytes}
      # 自动迁移：app 启动前自动执行 migrate up
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
    volumes:
      - app-logs:/app/logs
      # 如需自定义配置，取消注释挂载本地 configs 目录：
      # - ./configs:/app/configs:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - orange-tv-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: orange-tv-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${DB_NAME:-orange_tv}
      - MYSQL_USER=${DB_USER:-orange}
      - MYSQL_PASSWORD=${DB_PASSWORD:-orange_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - orange-tv-net
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  orange-tv-net:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  app-logs:
    driver: local
