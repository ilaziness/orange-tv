<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script>
      // 提前应用 theme class，避免静态 loading 与 AppLoading 主题切换闪烁
      // 行为对齐 next-themes：localStorage 'theme' 优先，否则跟随系统 prefers-color-scheme
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored
          if (theme === 'system' || !theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      #app-bootstrap-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin: 0;
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
      }
      .dark #app-bootstrap-loading {
        background: oklch(0.145 0 0);
        color: oklch(0.9 0 0);
      }
      #app-bootstrap-loading .spinner {
        width: 32px;
        height: 32px;
        animation: app-bootstrap-spin 0.8s linear infinite;
      }
      #app-bootstrap-loading p {
        margin: 0;
        font-size: 14px;
        color: oklch(0.556 0 0);
      }
      .dark #app-bootstrap-loading p {
        color: oklch(0.708 0 0);
      }
      @keyframes app-bootstrap-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-bootstrap-loading">
        <svg
          class="spinner"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          role="status"
          aria-label="Loading"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <p>加载中...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
