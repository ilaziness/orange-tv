# Development environment configuration
app:
  env: dev

http:
  port: 8080
  shutdown_timeout: 30

log:
  level: debug
  format: console
  output: both
  filename: logs/app.log

# Database configuration (MySQL for development)
database:
  driver: mysql
  host: 127.0.0.1
  port: 3306
  user: root
  password: root
  database: orange_tv
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300
