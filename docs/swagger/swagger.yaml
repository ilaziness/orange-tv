host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: 小橘TV - 影视站系统
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: 小橘TV
  version: "1.0"
paths:
  /api/admin/v1/actors:
    get:
      consumes:
      - application/json
      description: 分页获取演员列表
      parameters:
      - description: 关键词搜索（名称）
        in: query
        name: keyword
        type: string
      - description: 每页数量（兼容旧参数 page_size 存在时忽略），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 页码，从 1 开始
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - description: 每页数量（优先于 limit），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/admin.NamedResponse'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: 演员列表
      tags:
      - 管理端｜元数据管理
    post:
      consumes:
      - application/json
      description: 创建一个新的演员
      parameters:
      - description: 演员参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CreateNamedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.NamedResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 新建演员
      tags:
      - 管理端｜元数据管理
  /api/admin/v1/actors/{id}:
    delete:
      description: 删除指定演员
      parameters:
      - description: 演员ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除演员
      tags:
      - 管理端｜元数据管理
    put:
      consumes:
      - application/json
      description: 更新指定演员信息
      parameters:
      - description: 演员ID
        in: path
        name: id
        required: true
        type: integer
      - description: 演员参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.UpdateNamedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.NamedResponse'
              type: object
      security:
      - BearerAuth: []
      summary: 更新演员
      tags:
      - 管理端｜元数据管理
  /api/admin/v1/admin-login-logs:
    get:
      consumes:
      - application/json
      description: 分页获取管理员登录日志
      parameters:
      - description: 结束时间（RFC3339 或日期字符串）
        in: query
        name: end
        type: string
      - description: 每页数量（兼容旧参数 page_size 存在时忽略），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 页码，从 1 开始
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - description: 每页数量（优先于 limit），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 开始时间（RFC3339 或日期字符串）
        in: query
        name: start
        type: string
      - description: 登录结果筛选（1=成功，2=失败）
        enum:
        - 1
        - 2
        in: query
        name: status
        type: integer
      - description: 管理员用户名筛选
        in: query
        name: username
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/admin.AdminLoginLogItem'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: 管理员登录日志列表
      tags:
      - 管理端｜日志管理
  /api/admin/v1/admins:
    get:
      consumes:
      - application/json
      description: 分页获取管理员列表
      parameters:
      - description: 用户组ID筛选
        in: query
        name: group_id
        type: integer
      - description: 关键词搜索（用户名/昵称）
        in: query
        name: keyword
        type: string
      - description: 每页数量（兼容旧参数 page_size 存在时忽略），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 页码，从 1 开始
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - description: 每页数量（优先于 limit），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 状态筛选（0=禁用，1=启用）
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/admin.AdminItem'
                        type: array
                    type: object
              type: object
      security:
      - BearerAuth: []
      summary: 管理员列表
      tags:
      - 管理端｜管理员管理
    post:
      consumes:
      - application/json
      description: 创建一个新的管理员
      parameters:
      - description: 管理员参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.CreateAdminRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin.AdminItem'
              type: object
      security:
      - BearerAuth: []
      summary: 新建管理员
      tags:
      - 管理端｜管理员管理
  /api/admin/v1/admins/{id}:
    delete:
      description: 删除指定管理员
      parameters:
      - description: 管理员ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除管理员
      tags:
      - 管理端｜管理员管理
    put:
      consumes:
