basePath: /
definitions:
  admin.AdItem:
    properties:
      ad_key:
        description: 广告标识 key
        type: string
      content_code:
        description: 自定义代码内容（type=code 时使用）
        type: string
      content_url:
        description: 内容资源地址
        type: string
      duration:
        description: 广告时长（秒）
        type: integer
      id:
        description: 广告ID
        type: integer
      link_url:
        description: 点击跳转链接
        type: string
      scene:
        description: 广告场景（video_loading=片头加载广告，general=通用广告）
        type: string
      sort:
        description: 排序权重，值越小越靠前
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
      title:
        description: 广告标题
        type: string
      type:
        description: 广告类型（image=图片，video=视频，html=HTML，code=自定义代码）
        type: string
    type: object
  admin.AdminItem:
    properties:
      avatar:
        description: 头像地址
        type: string
      created_at:
        description: 创建时间
        type: string
      email:
        description: 邮箱
        type: string
      group_id:
        description: 用户组ID
        type: integer
      group_name:
        description: 用户组名称
        type: string
      id:
        description: 管理员ID
        type: integer
      last_login_at:
        description: 最近登录时间
        type: string
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
      username:
        description: 用户名
        type: string
    type: object
  admin.AdminLoginLogItem:
    properties:
      created_at:
        description: 登录时间
        type: string
      id:
        description: 日志ID
        type: integer
      ip:
        description: 登录 IP 地址
        type: string
      status:
        description: 登录结果（1=成功，2=失败）
        type: integer
      user_agent:
        description: User-Agent 信息
        type: string
      user_id:
        description: 管理员用户ID
        type: integer
      username:
        description: 管理员用户名
        type: string
    type: object
  admin.AppLogItem:
    properties:
      fields:
        additionalProperties: {}
        description: 附加字段
        type: object
      level:
        description: 日志级别（如 info、error）
        type: string
      msg:
        description: 日志消息
        type: string
      time:
        description: 日志时间
        type: string
    type: object
  admin.AppLogListResponse:
    properties:
      has_more:
        description: 是否还有更多
        type: boolean
      list:
        description: 日志列表
        items:
          $ref: '#/definitions/admin.AppLogItem'
        type: array
      next_offset:
        description: 下一次读取的偏移量
        type: integer
    type: object
  admin.BannerItem:
    properties:
      cover:
        description: 封面地址
        type: string
      id:
        description: 横幅ID
        type: integer
      link:
        description: 跳转链接
        type: string
      sort:
        description: 排序权重，值越小越靠前
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
      title:
        description: 横幅标题
        type: string
      video_id:
        description: 关联视频ID
        type: integer
    type: object
  admin.BatchUpdateEpisodeStatusRequest:
    properties:
      source_id:
        description: 播放源ID（必填）
        minimum: 1
        type: integer
      status:
        description: 目标状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      video_id:
        description: 视频ID（必填）
        minimum: 1
        type: integer
    required:
    - source_id
    - video_id
    type: object
  admin.BatchUpdateEpisodeStatusResponse:
    properties:
      affected:
        description: 受影响的行数
        type: integer
    type: object
  admin.BatchUpdateExecuteRequest:
    properties:
      new_value:
        description: 新值（必填）
        maxLength: 2000
        type: string
      old_value:
        description: 旧值（必填）
        maxLength: 2000
        type: string
      target:
        description: 目标字段（video_cover=视频封面，episode_url=剧集地址，必填）
        enum:
        - video_cover
        - episode_url
        type: string
    required:
    - new_value
    - old_value
    - target
    type: object
  admin.BatchUpdateExecuteResponse:
    properties:
      updated_rows:
        description: 更新成功的数据行数
        type: integer
    type: object
  admin.BatchUpdatePreviewRequest:
    properties:
      old_value:
        description: 旧值（必填）
        maxLength: 2000
        type: string
      target:
        description: 目标字段（video_cover=视频封面，episode_url=剧集地址，必填）
        enum:
        - video_cover
        - episode_url
        type: string
    required:
    - old_value
    - target
    type: object
  admin.BatchUpdatePreviewResponse:
    properties:
      matched_rows:
        description: 匹配到的数据行数
        type: integer
    type: object
  admin.BatchVideoRequest:
    properties:
      ids:
        description: 视频ID列表（1-500 个，必填）
        items:
          type: integer
        maxItems: 500
        minItems: 1
        type: array
      status:
        description: 操作后的状态（0=下架，1=上架）
        enum:
        - 0
        - 1
        type: integer
    required:
    - ids
    type: object
  admin.BatchVideoResponse:
    properties:
      affected:
        description: 受影响的行数
        type: integer
    type: object
  admin.CategoryResponse:
    properties:
      children:
        description: 子分类列表
        items:
          $ref: '#/definitions/admin.CategoryResponse'
        type: array
      id:
        description: 分类ID
        type: integer
      name:
        description: 分类名称
        type: string
      parent_id:
        description: 父分类ID，0 表示顶级分类
        type: integer
      sort_order:
        description: 排序权重，值越小越靠前
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
    type: object
  admin.ChangePasswordRequest:
    properties:
      new_password:
        description: 新密码（必填，6-72 位）
        maxLength: 72
        minLength: 6
        type: string
      old_password:
        description: 旧密码（必填）
        maxLength: 72
        minLength: 6
        type: string
    required:
    - new_password
    - old_password
    type: object
  admin.CollectCategoryInput:
    properties:
      category_id:
        description: 系统分类ID（必填）
        type: integer
      external_category_id:
        description: 外部分类ID（必填）
        type: integer
    required:
    - category_id
    - external_category_id
    type: object
  admin.CollectCategoryMapItem:
    properties:
      category_id:
        description: 系统分类ID
        type: integer
      external_category_id:
        description: 外部分类ID
        type: integer
      id:
        description: 映射ID
        type: integer
      source_id:
        description: 采集源ID
        type: integer
    type: object
  admin.CollectLogItem:
    properties:
      collect_count:
        description: 采集数量
        type: integer
      created_at:
        description: 执行时间
        type: string
      duration_sec:
        description: 执行耗时（秒）
        type: integer
      id:
        description: 日志ID
        type: integer
      source_id:
        description: 采集源ID
        type: integer
      source_name:
        description: 采集源名称
        type: string
      status:
        description: 执行状态（0=失败，1=成功）
        type: integer
    type: object
  admin.CollectNowRequest:
    properties:
      data_range:
        description: 采集数据范围（必填：today=今日，last1d/last3d/last1w/last1m=近N天，all=全部）
        enum:
        - today
        - last1d
        - last3d
        - last1w
        - last1m
        - all
        type: string
    required:
    - data_range
    type: object
  admin.CollectSourceItem:
    properties:
      collect_url:
        description: 采集接口地址
        type: string
      cron_expr:
        description: 定时采集 cron 表达式
        type: string
      data_range:
        description: 采集数据范围
        type: string
      id:
        description: 采集源ID
        type: integer
      last_collect_at:
        description: 最近采集时间
        type: string
      name:
        description: 采集源名称
        type: string
      play_source_id:
        description: 关联播放源ID
        type: integer
      play_source_name:
        description: 关联播放源名称
        type: string
      schedule_enabled:
        description: 是否启用定时采集（0=否，1=是）
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
      type:
        description: 采集源类型（1=API，2=其他）
        type: integer
    type: object
  admin.CommentListItem:
    properties:
      content:
        description: 评论内容
        type: string
      created_at:
        description: 评论时间
        type: string
      dislike_count:
        description: 踩数
        type: integer
      id:
        description: 评论ID
        type: integer
      like_count:
        description: 点赞数
        type: integer
      nickname:
        description: 昵称
        type: string
      parent_id:
        description: 父评论ID，0 表示顶级评论
        type: integer
      status:
        description: 审核状态（0=未通过，1=通过）
        type: integer
      user_id:
        description: 用户ID
        type: integer
      video_id:
        description: 视频ID
        type: integer
      video_title:
        description: 视频标题
        type: string
    type: object
  admin.CommentParentItem:
    properties:
      content:
        description: 评论内容
        type: string
      created_at:
        description: 评论时间
        type: string
      id:
        description: 评论ID
        type: integer
      nickname:
        description: 昵称
        type: string
      parent_id:
        description: 父评论ID
        type: integer
      user_id:
        description: 用户ID
        type: integer
    type: object
  admin.CreateAdRequest:
    properties:
      ad_key:
        description: 广告标识 key（必填）
        maxLength: 50
        minLength: 1
        type: string
      content_code:
        description: 自定义代码内容（type=code 时使用）
        maxLength: 10000
        type: string
      content_url:
        description: 内容资源地址
        maxLength: 500
        type: string
      duration:
        description: 广告时长（秒，1-300）
        maximum: 300
        minimum: 1
        type: integer
      link_url:
        description: 点击跳转链接
        maxLength: 500
        type: string
      scene:
        description: 广告场景（必填：video_loading=片头加载广告，general=通用广告）
        enum:
        - video_loading
        - general
        type: string
      sort:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      title:
        description: 广告标题（必填）
        maxLength: 128
        minLength: 1
        type: string
      type:
        description: 广告类型（必填：image=图片，video=视频，html=HTML，code=自定义代码）
        enum:
        - image
        - video
        - html
        - code
        type: string
    required:
    - ad_key
    - scene
    - title
    - type
    type: object
  admin.CreateAdminRequest:
    properties:
      avatar:
        description: 头像地址（可选）
        maxLength: 500
        type: string
      email:
        description: 邮箱（可选）
        maxLength: 128
        type: string
      group_id:
        description: 用户组ID（必填）
        minimum: 1
        type: integer
      password:
        description: 密码（必填，6-72 位）
        maxLength: 72
        minLength: 6
        type: string
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      username:
        description: 用户名（必填，3-50 位）
        maxLength: 50
        minLength: 3
        type: string
    required:
    - group_id
    - password
    - username
    type: object
  admin.CreateBannerRequest:
    properties:
      cover:
        description: 封面地址（必填）
        maxLength: 500
        type: string
      link:
        description: 跳转链接
        maxLength: 500
        type: string
      sort:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      title:
        description: 横幅标题（必填）
        maxLength: 128
        minLength: 1
        type: string
      video_id:
        description: 关联视频ID
        minimum: 1
        type: integer
    required:
    - cover
    - title
    type: object
  admin.CreateCategoryRequest:
    properties:
      name:
        description: 分类名称（必填，1-100 字）
        maxLength: 100
        minLength: 1
        type: string
      parent_id:
        description: 父分类ID，0 表示顶级分类
        minimum: 0
        type: integer
      sort_order:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  admin.CreateCollectSourceRequest:
    properties:
      api_key:
        description: API 密钥
        maxLength: 255
        type: string
      collect_url:
        description: 采集接口地址（必填）
        maxLength: 500
        minLength: 1
        type: string
      cron_expr:
        description: 定时采集 cron 表达式
        maxLength: 100
        type: string
      data_range:
        description: 采集数据范围（如 today、last1d 等）
        maxLength: 20
        type: string
      name:
        description: 采集源名称（必填）
        maxLength: 100
        minLength: 1
        type: string
      play_source_id:
        description: 关联播放源ID（必填）
        type: integer
      type:
        description: 采集源类型（1=API，2=其他）
        enum:
        - 1
        - 2
        type: integer
    required:
    - collect_url
    - name
    - play_source_id
    - type
    type: object
  admin.CreateLiveRequest:
    properties:
      category:
        description: 频道分类
        maxLength: 50
        type: string
      description:
        description: 频道描述
        maxLength: 2000
        type: string
      logo:
        description: 频道 Logo 地址
        maxLength: 500
        type: string
      name:
        description: 频道名称（必填）
        maxLength: 100
        minLength: 1
        type: string
      sort_order:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      stream_url:
        description: 播放流地址（必填）
        maxLength: 1000
        minLength: 1
        type: string
    required:
    - name
    - stream_url
    type: object
  admin.CreateNamedRequest:
    properties:
      name:
        description: 名称（必填，1-100 字）
        maxLength: 100
        minLength: 1
        type: string
    required:
    - name
    type: object
  admin.CreatePlayEpisodeRequest:
    properties:
      episode_number:
        description: 集数（必填）
        minimum: 1
        type: integer
      format:
        description: 播放格式（必填：hls=HLS，mp4=MP4，dash=DASH，flv=FLV）
        enum:
        - hls
        - mp4
        - dash
        - flv
        type: string
      play_url:
        description: 播放地址（必填）
        maxLength: 1000
        minLength: 1
        type: string
      quality:
        description: 清晰度（如 高清、超清）
        maxLength: 50
        type: string
      sort_order:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      source_id:
        description: 播放源ID（必填）
        minimum: 1
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
      title:
        description: 剧集标题
        maxLength: 255
        type: string
      video_id:
        description: 视频ID（必填）
        minimum: 1
        type: integer
    required:
    - episode_number
    - format
    - play_url
    - source_id
    - video_id
    type: object
  admin.CreatePlaySourceRequest:
    properties:
      name:
        description: 播放源名称（必填）
        maxLength: 100
        minLength: 1
        type: string
      sort_order:
        description: 排序权重，值越小越靠前
        minimum: 0
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
    required:
    - name
    type: object
  admin.CreateUserGroupRequest:
    properties:
      description:
        description: 描述
        maxLength: 255
        type: string
      name:
        description: 用户组名称（必填，1-64 字）
        maxLength: 64
        minLength: 1
        type: string
      permissions:
        description: 权限配置（JSON 字符串）
        maxLength: 2000
        type: string
    required:
    - name
    type: object
  admin.CreateUserRequest:
    properties:
      avatar:
        description: 头像地址（可选）
        maxLength: 500
        type: string
      email:
        description: 邮箱（必填）
        maxLength: 128
        type: string
      nickname:
        description: 昵称（可选）
        maxLength: 15
        minLength: 3
        type: string
      password:
        description: 密码（必填，6-72 位）
        maxLength: 72
        minLength: 6
        type: string
      status:
        description: 状态（0=禁用，1=启用）
        enum:
        - 0
        - 1
        type: integer
    required:
    - email
    - password
    type: object
  admin.CreateVideoRequest:
    properties:
      actors:
        description: 演员列表
        items:
          $ref: '#/definitions/admin.VideoActorInput'
        type: array
      category_id:
        description: 分类ID（必填）
        minimum: 1
        type: integer
      cover_image:
        description: 封面地址
        maxLength: 500
        type: string
      description:
        description: 剧情简介
        maxLength: 10000
        type: string
      director_ids:
        description: 导演ID列表
        items:
          type: integer
        type: array
      duration:
        description: 总时长（分钟）
        minimum: 0
        type: integer
      language:
        description: 语言
        maxLength: 50
        type: string
      poster_image:
        description: 海报地址
        maxLength: 500
        type: string
      publish_status:
        description: 上架状态（0=未上架，1=已上架）
        enum:
        - 0
        - 1
        type: integer
      region:
        description: 地区
        maxLength: 50
        type: string
      release_date:
        description: 上映日期
        maxLength: 64
        type: string
      serial_status:
        description: 连载状态（1=连载中，2=已完结，3=未知）
        enum:
        - 1
        - 2
        - 3
        type: integer
      subtitle:
        description: 副标题
        maxLength: 255
        type: string
      tag_ids:
        description: 标签ID列表
        items:
          type: integer
        type: array
      title:
        description: 视频标题（必填）
        maxLength: 255
        minLength: 1
        type: string
      year:
        description: 上映年份
        maximum: 9999
        minimum: 0
        type: integer
    required:
    - category_id
    - title
    type: object
  admin.DashboardResponse:
    properties:
      collect_running:
        description: 正在执行的采集任务数
        type: integer
      offline_videos:
        description: 未上架视频数
        type: integer
      online_count:
        description: 当前在线用户数
        type: integer
      online_videos:
        description: 已上架视频数
        type: integer
      today_pv:
        description: 今日浏览量（PV）
        type: integer
      today_uv:
        description: 今日访客数（UV）
        type: integer
      today_videos:
        description: 今日新增视频数
        type: integer
      total_admins:
        description: 管理员总数
        type: integer
      total_categories:
        description: 分类总数
        type: integer
      total_users:
        description: 用户总数
        type: integer
      total_videos:
        description: 视频总数
        type: integer
    type: object
  admin.LiveChannelItem:
    properties:
      category:
        description: 频道分类
        type: string
      description:
        description: 频道描述
        type: string
      id:
        description: 频道ID
        type: integer
      logo:
        description: 频道 Logo 地址
        type: string
      name:
        description: 频道名称
        type: string
      sort_order:
        description: 排序权重，值越小越靠前
        type: integer
      status:
        description: 状态（0=禁用，1=启用）
        type: integer
      stream_url:
        description: 播放流地址
        type: string
    type: object
  admin.LiveSyncRequest:
    properties:
      source_url:
        description: 直播源地址（必填，合法 URL）
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - source_url
    type: object
  admin.LiveSyncResult:
    properties:
      created:
