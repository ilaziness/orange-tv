      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 新建演员
      tags:
      - 管理端｜元数据管理
  /api/admin/v1/actors/{id}:
    delete:
      description: 删除指定演员
      parameters:
      - description: 演员ID
        in: path
        name: id
        required: true
