  /api/open/v1/videos/detail:
    get:
      description: 支持多个视频 id，返回视频详情数组
      parameters:
      - collectionFormat: multi
        description: 视频 id，可重复
        in: query
        items:
          type: integer
        name: id
        required: true
        type: array
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/open.VideoDetailItem'
                  type: array
              type: object
      summary: 开放影视详情
      tags:
      - 开放端｜开放资源
  /health:
    get:
      consumes:
      - application/json
      description: 检查应用是否正常运行（不检查外部依赖）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 健康检查
      tags:
      - 健康检查
  /liveness:
    get:
      consumes:
      - application/json
      description: 检查应用是否存活（不检查外部依赖）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 存活检查
      tags:
      - 健康检查
  /readiness:
    get:
      consumes:
      - application/json
      description: 检查应用及其依赖是否就绪
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Response'
      summary: 就绪检查
      tags:
      - 健康检查
  /version:
    get:
      consumes:
      - application/json
      description: 获取应用名称和版本
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取版本信息
      tags:
      - 健康检查
swagger: "2.0"
