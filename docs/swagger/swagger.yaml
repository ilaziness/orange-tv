      - 用户端｜用户中心
  /api/client/v1/videos/{id}/episodes/{source_id}/{episode_id}:
    get:
      consumes:
      - application/json
      description: 根据影视ID和剧集主键ID获取播放地址
      parameters:
      - description: 影视ID
        in: path
        name: id
        required: true
        type: integer
      - description: 播放源ID
        in: path
        name: source_id
        required: true
        type: integer
      - description: 剧集主键ID
        in: path
        name: episode_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/client.PlayEpisodeResponse'
              type: object
      summary: 获取单集播放地址
      tags:
      - 用户端｜影视浏览
  /api/client/v1/videos/{id}/related:
    get:
      consumes:
      - application/json
      description: 获取指定影视的相关推荐列表
      parameters:
      - description: 影视ID
        in: path
        name: id
        required: true
        type: integer
      - description: 返回数量（1-50，默认由服务端控制）
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/client.VideoListItem'
                  type: array
              type: object
      summary: 相关影视
      tags:
      - 用户端｜影视浏览
  /api/open/v1/categories:
    get:
      consumes:
      - application/json
      description: 返回启用中的分类扁平列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/open.CategoryItem'
                  type: array
              type: object
      summary: 开放分类列表
      tags:
      - 开放端｜开放资源
  /api/open/v1/videos:
    get:
      consumes:
      - application/json
      description: 返回启用的影视列表，每项只包含 id、title、category_id、created_at
      parameters:
      - description: 按创建时间筛选（today/last1d/last3d/last1w/last1m/all），为空表示全部
        enum:
        - today
        - last1d
        - last3d
        - last1w
        - last1m
        - all
        in: query
        name: data_range
        type: string
      - description: 每页数量（兼容旧参数 page_size 存在时忽略），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 页码，从 1 开始
        in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - description: 每页数量（优先于 limit），范围 1-100
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - description: 按播放源名称筛选（精确匹配），为空表示不筛选
        in: query
        maxLength: 10
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/response.PageData'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/open.VideoListItem'
                        type: array
                    type: object
              type: object
      summary: 开放影视列表
      tags:
      - 开放端｜开放资源
  /api/open/v1/videos/detail:
    get:
      consumes:
      - application/json
      description: 支持多个视频 id，返回视频详情数组
      parameters:
      - collectionFormat: csv
        description: 视频ID列表（最多 50 个，可传多个 id 参数）
        in: query
        items:
          type: integer
        maxItems: 50
        name: id
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/open.VideoDetailItem'
                  type: array
              type: object
      summary: 开放影视详情
      tags:
      - 开放端｜开放资源
  /health:
    get:
      consumes:
      - application/json
      description: 检查应用是否正常运行（不检查外部依赖）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 健康检查
      tags:
      - 健康检查
  /liveness:
    get:
      consumes:
      - application/json
      description: 检查应用是否存活（不检查外部依赖）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 存活检查
      tags:
      - 健康检查
  /readiness:
    get:
      consumes:
      - application/json
      description: 检查应用及其依赖是否就绪
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "503":
          description: Service Unavailable
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: 就绪检查
      tags:
      - 健康检查
  /version:
    get:
      consumes:
      - application/json
      description: 获取应用名称和版本
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: 获取版本信息
      tags:
      - 健康检查
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
