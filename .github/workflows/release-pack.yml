name: Release Pack

on:
  push:
    tags:
      - 'v*'

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd web
          npm ci

      - name: Pack release directory
        run: make pack VERSION="${GITHUB_REF_NAME}"

      - name: Archive tar.gz
        run: |
          tar -czf "orange-tv-${GITHUB_REF_NAME}.tar.gz" -C build "${GITHUB_REF_NAME}"

      - name: Archive zip
        run: |
          cd build
          zip -r "../orange-tv-${GITHUB_REF_NAME}.zip" "${GITHUB_REF_NAME}"

      - name: Generate release notes
        run: |
          cat > release-notes.md <<EOF
          Orange TV ${GITHUB_REF_NAME} 发布包

          打包产物：
          - orange-tv-${GITHUB_REF_NAME}.tar.gz：推荐用于 Linux / macOS
          - orange-tv-${GITHUB_REF_NAME}.zip：推荐用于 Windows

          解压后请查看包内 README.md 了解部署方式。
          EOF

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --notes-file release-notes.md \
            "orange-tv-${GITHUB_REF_NAME}.tar.gz" \
            "orange-tv-${GITHUB_REF_NAME}.zip"
